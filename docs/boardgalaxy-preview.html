<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>版块星河 · 预览</title>
<script>
  const vars = {
    light: {
      '--page': '#F4F2EC', '--card': '#FFFFFF', '--card-soft': '#ECEAE2',
      '--ink': '#15292D', '--ink-soft': '#5D6F72', '--line': '#E0DCD0',
      '--brand': '#087F8C', '--brand-deep': '#065F6B'
    },
    dark: {
      '--page': '#10171A', '--card': '#1A2327', '--card-soft': '#222D31',
      '--ink': '#E6EDEA', '--ink-soft': '#90A1A0', '--line': '#283338',
      '--brand': '#2EB4A9', '--brand-deep': '#187E78'
    }
  };
  function apply(mode) {
    const root = document.documentElement;
    Object.entries(vars[mode]).forEach(([k, v]) => root.style.setProperty(k, v));
  }
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: var(--page); color: var(--ink);
    -webkit-font-smoothing: antialiased; max-width: 430px; margin: 0 auto;
  }
  .phone { padding: 18px 18px 60px; }

  .nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 6px; }
  .nav h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.4px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--brand); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .theme-toggle { position: fixed; top: 16px; right: 16px; z-index: 9; font-size: 12px; color: var(--ink-soft);
    background: var(--card); border: 1px solid var(--line); padding: 6px 10px; border-radius: 999px; cursor: pointer; }

  .hero { margin-top: 14px; border-radius: 24px; padding: 20px; color: #fff;
    background: linear-gradient(135deg, var(--brand-deep), var(--brand)); }
  .hero .status { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; opacity: .95; }
  .hero .dot { width: 9px; height: 9px; border-radius: 50%; background: #F0A03C; }
  .hero h2 { font-size: 22px; font-weight: 800; margin: 14px 0 6px; }
  .hero p { font-size: 14px; opacity: .82; line-height: 1.45; }
  .hero .cta { display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; background: #fff;
    color: var(--brand-deep); font-weight: 600; font-size: 15px; padding: 11px 18px; border-radius: 999px; }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 4px 12px; }
  .section-head h3 { font-size: 20px; font-weight: 800; }
  .section-head span { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .board { position: relative; background: var(--card); border: 1px solid rgba(0,0,0,.12); border-radius: 20px; padding: 14px; height: 134px; overflow: hidden; }
  .board .top { display: flex; align-items: flex-start; justify-content: space-between; }
  .orb { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; }
  .board .chev { color: var(--ink-soft); opacity: .55; font-size: 13px; font-weight: 600; }
  .board .name { margin-top: 16px; font-size: 17px; font-weight: 700; line-height: 1.2; }
  .board .fid { margin-top: 4px; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  .add { display: flex; align-items: center; gap: 14px; margin-top: 14px; background: var(--card);
    border: 1px solid var(--brand); border-radius: 20px; padding: 14px; }
  .add .plus { width: 46px; height: 46px; border-radius: 14px; background: color-mix(in srgb, var(--brand) 14%, transparent);
    display: flex; align-items: center; justify-content: center; color: var(--brand); font-size: 22px; font-weight: 600; }
  .add .label { flex: 1; font-weight: 700; font-size: 17px; }
  .add .chev { color: var(--ink-soft); opacity: .55; }

  .foot { font-size: 13px; color: var(--ink-soft); margin-top: 22px; padding: 0 4px; line-height: 1.5; }
</style>
</head>
<body>
<button class="theme-toggle" onclick="const m=this.dataset.m==='dark'?'light':'dark';this.dataset.m=m;apply(m)">切换深色</button>
<div class="phone">
  <div class="nav">
    <h1>版块</h1>
    <div class="avatar">👤</div>
  </div>

  <div class="hero">
    <div class="status"><span class="dot"></span>需要完成网页验证</div>
    <h2>连接 NGA，进入你的版块</h2>
    <p>先完成一次 NGA 网页验证或登录，就能浏览实时的主题与帖子。</p>
    <div class="cta">连接 NGA ›</div>
  </div>

  <div class="section-head"><h3>我的版块</h3><span>2 个版块</span></div>
  <div class="grid">
    <div class="board">
      <div class="top"><div class="orb" style="background:#2FB49B26;color:#2FB49B">版</div><span class="chev">›</span></div>
      <div class="name">版块 414</div>
      <div class="fid">FID 414</div>
    </div>
    <div class="board">
      <div class="top"><div class="orb" style="background:#E0A03C26;color:#E0A03C">版</div><span class="chev">›</span></div>
      <div class="name">版块 -547859</div>
      <div class="fid">FID -547859</div>
    </div>
  </div>

  <div class="add"><span class="plus">+</span><span class="label">添加版块</span><span class="chev">›</span></div>

  <p class="foot">这些是本机保存的入口，不是服务器返回的版块目录。可以用 NGA 链接中的 fid 添加版块。</p>
</div>
<script>apply('light');</script>
</body>
</html>
